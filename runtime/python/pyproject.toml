[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corvid-runtime"
version = "0.0.1"
description = "Write Corvid tools in Python: the @tool decorator corvid serve and corvid run load."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Corvid Authors" }]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["corvid_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

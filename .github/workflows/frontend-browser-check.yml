name: Frontend browser check
run-name: Browser check for ${{ inputs.suite }} at ${{ inputs.revision }}
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git commit to build and test
        required: true
      suite:
        description: Comma-separated browser test suite names
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CORVID_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: python -m pip install playwright
      - name: Install inventory performance test dependencies
        if: contains(format(',{0},', inputs.suite), ',windowed_inventory,')
        run: |
          python -m pip install psutil
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m playwright install firefox webkit
      - name: Build Corvid
        run: cargo build --locked -p corvid-cli --bin corvid
      - name: Run the selected Edge check
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          $cli = (Resolve-Path target/debug/corvid.exe).Path
          foreach ($suite in $env:SUITE.Split(',')) {
            if ($suite -cnotmatch '^[a-z][a-z0-9_]*$') { throw 'Invalid browser suite name' }
            $script = "scripts/verify_$suite.py"
            Write-Host "Running $script"
            if ($suite -eq 'browser_stream') { python -B $script $cli --channel msedge }
            else { python -B $script --cli $cli --channel msedge }
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

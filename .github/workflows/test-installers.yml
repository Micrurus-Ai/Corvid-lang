# Lint + smoke-test the install/ scripts and web/ worker on every change.
#
# Layered for fast feedback:
#   lint   — runs on every PR, ~30 seconds (shellcheck, PSScriptAnalyzer,
#            node --check, sh -n). Catches the typo class of bug.
#   smoke  — runs install.sh end-to-end on ubuntu, asserting that `corvid`
#            ends up on PATH and that `corvid new` produces a project that
#            type-checks. Only fires on install/** changes.
#   matrix — full macOS + Windows install runs. Manual dispatch only,
#            because they cost CI minutes and the lint job already
#            catches the everyday regressions.

name: test-installers

on:
  push:
    branches: [main]
    paths:
      - "install/**"
      - "web/**"
      - ".github/workflows/test-installers.yml"
  pull_request:
    paths:
      - "install/**"
      - "web/**"
      - ".github/workflows/test-installers.yml"
  workflow_dispatch:
    inputs:
      recovery_only:
        description: Run only offline installer lifecycle and tagged source checks across native architectures
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    if: ${{ !inputs.recovery_only }}
    name: lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck install.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./install
          severity: warning

      - name: POSIX parse check (sh -n)
        run: sh -n install/install.sh

      - name: node --check worker.js
        run: node --check web/worker.js

  pwsh-lint:
    if: ${{ !inputs.recovery_only }}
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          # PSScriptAnalyzer is pre-installed on the windows-latest runner
          # image. Only install if a fresh runner ever drops it; -AllowClobber
          # tolerates duplicate cmdlet names from older copies in PSModulePath.
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          }
          # PSAvoidUsingWriteHost is intentional: install.ps1 is an
          # interactive bootstrap that needs colored progress output.
          # Write-Output pollutes the pipeline; Write-Information is
          # silent by default. Write-Host is the right tool here.
          $issues = Invoke-ScriptAnalyzer -Path install\install.ps1 `
              -Severity Error,Warning `
              -ExcludeRule PSAvoidUsingWriteHost
          if ($issues) {
              $issues | Format-Table -AutoSize
              exit 1
          }
          Write-Host "install.ps1 clean"

  upgrade-recovery:
    name: offline upgrade recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.recovery_only && '["ubuntu-latest","ubuntu-24.04-arm","macos-15-intel","macos-15","windows-latest","windows-11-arm"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Exercise installer replacement and recovery
        run: python install/test_upgrade.py
      - name: Build a stable source fallback from a tagged checkout
        run: python install/test_source_install.py

  source-checkout:
    name: Source installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, pwsh-lint]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: source-installer-${{ matrix.os }}

      - name: Pin the checked-out commit in a local Git repository
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          checkout = Path.cwd()
          tag = "installer-check-" + os.environ["GITHUB_SHA"]
          subprocess.run(["git", "tag", tag, "HEAD"], check=True)
          settings = {
              "CORVID_REPO": "installer-fixture/corvid",
              "CORVID_VERSION": tag,
              "CORVID_HOME": str(Path(os.environ["RUNNER_TEMP"]) / ".corvid"),
              "CORVID_SKIP_EDITOR_EXTENSION": "1",
              "CORVID_NO_MODIFY_PROFILE": "1",
              "CARGO_TARGET_DIR": str(checkout / "target"),
              "GIT_CONFIG_COUNT": "1",
              "GIT_CONFIG_KEY_0": f"url.{checkout.as_uri()}.insteadOf",
              "GIT_CONFIG_VALUE_0": "https://github.com/installer-fixture/corvid.git",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              for key, value in settings.items():
                  print(f"{key}={value}", file=out)

      - name: Install from source (Unix)
        if: runner.os != 'Windows'
        run: sh install/install.sh --from-source

      - name: Install from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install\install.ps1 -FromSource

      - name: Check installed source and a fresh application
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ["CORVID_HOME"])
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root / "src", text=True)
          assert commit.strip() == os.environ["GITHUB_SHA"]
          app_parent = Path(os.environ["RUNNER_TEMP"])
          subprocess.run(["corvid", "--version"], check=True)
          subprocess.run(["corvid", "new", "testproj"], cwd=app_parent, check=True)
          project = app_parent / "testproj"
          assert (project / "src/std").is_dir()
          subprocess.run(["corvid", "check", "src/main.cor"], check=True, cwd=project)

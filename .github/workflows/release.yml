# Build downloadable Corvid archives for stable and beta version tags and nightly
# builds from main. Beta and nightly releases are marked as prereleases so the
# default installer downloads the latest stable version. Manual runs retain the
# candidate archives unless publication is explicitly selected.

name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      verify_performance:
        description: Measure the Windows x64 application baseline and exercise native tool linking
        type: boolean
        default: false
      publish_release:
        description: Publish all candidate archives to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      short_sha: ${{ steps.tag.outputs.short_sha }}
      commit_date: ${{ steps.tag.outputs.commit_date }}
    steps:
      - uses: actions/checkout@v4
      # Compute the release tag + channel + prerelease flag from
      # the workflow trigger. Three cases:
      #   - version tag → stable for vX.Y.Z or beta for vX.Y.Z-beta.N.
      #     Only stable tags are eligible for the latest stable download.
      #   - push to `main` → nightly channel; tag =
      #     `nightly-YYYY-MM-DD-<short-sha>`; prerelease = true;
      #     "latest" pointer does NOT advance so the install
      #     script's fast path keeps meaning "latest stable."
      #   - `workflow_dispatch` → treats as nightly (manual
      #     nightly cut from main).
      # Slice `35V2-P33-release-nightly-channel`.
      - name: Compute release tag + channel
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF:-}"
          short_sha="$(git rev-parse --short HEAD)"
          date_utc="$(date -u +%Y-%m-%d)"
          if [[ "$ref" == refs/tags/v* ]]; then
            release_tag="${ref#refs/tags/}"
            number='(0|[1-9][0-9]*)'
            core="v${number}[.]${number}[.]${number}"
            if [[ "$release_tag" =~ ^${core}$ ]]; then
              channel="stable"
              prerelease="false"
            elif [[ "$release_tag" =~ ^${core}-beta[.]${number}$ ]]; then
              channel="beta"
              prerelease="true"
            else
              echo "Expected a version tag such as v1.0.0 or v1.0.0-beta.1." >&2
              exit 1
            fi
          else
            release_tag="nightly-${date_utc}-${short_sha}"
            channel="nightly"
            prerelease="true"
          fi
          {
            echo "release_tag=$release_tag"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
            echo "short_sha=$short_sha"
            echo "commit_date=$date_utc"
          } >> "$GITHUB_OUTPUT"
          echo "Computed: tag=$release_tag channel=$channel prerelease=$prerelease commit_date=$date_utc"

  build:
    needs: prepare
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      # Match CI and the tested Windows build when the runner supplies newer CPython.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: macos-15,         target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    archive: zip    }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,   archive: zip    }

    steps:
      - uses: actions/checkout@v4

      - name: Select the documented macOS Python framework
        if: runner.os == 'macOS'
        env:
          FRAMEWORK_VERSION: ${{ matrix.target == 'aarch64-apple-darwin' && '3.15' || '3.14' }}
        run: |
          framework="/Library/Frameworks/Python.framework/Versions/$FRAMEWORK_VERSION"
          python="$framework/bin/python$FRAMEWORK_VERSION"
          "$python" --version
          echo "PYO3_PYTHON=$python" >> "$GITHUB_ENV"
          echo "CORVID_PYTHON_FRAMEWORK=$framework/Python" >> "$GITHUB_ENV"

      - name: Select Windows Python for the release architecture
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check version tag against CLI package version
        if: needs.prepare.outputs.channel != 'nightly'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -eu
          package_id="$(cargo pkgid --locked -p corvid-cli)"
          version="${package_id##*#}"
          version="${version##*@}"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG disagrees with corvid-cli version $version." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode-corvid/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ needs.prepare.outputs.channel }}

      # Build corvid-runtime FIRST so cargo emits the `staticlib`
      # crate-type output that the cdylib link + native-tier
      # build paths both require. Cargo only emits all crate-type
      # outputs when the crate is the build TARGET, not when it's
      # pulled in as a dep — the same constraint that bit
      # `effect-system-gates` at `fcf4ce4` and `app-deploy-smoke`
      # at `0fc9d89`. Without this step, `libcorvid_runtime.a`
      # never lands and the install script can't ship it.
      - name: Build corvid-runtime (must precede CLI build so staticlib lands)
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }} -p corvid-runtime

      # `CORVID_BUILD_SHA` + `CORVID_BUILD_DATE` are env-var
      # overrides honored by `crates/corvid-cli/build.rs` (slice
      # `35V2-P33-version-output-sha`). Setting them here lets
      # the workflow inject canonical values rather than letting
      # build.rs run its own `git rev-parse` (which would
      # otherwise pick up the checkout-action's SHA strategy
      # depending on how the runner cloned).
      - name: Build
        if: runner.os != 'Linux'
        env:
          CORVID_BUILD_SHA: ${{ needs.prepare.outputs.short_sha }}
          CORVID_BUILD_DATE: ${{ needs.prepare.outputs.commit_date }}
          CORVID_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p corvid-cli -p corvid-lsp

      # The generated container runs on Debian 12. Link its release binary
      # against the same glibc and Python ABI on both Linux architectures.
      - name: Build Linux distribution on Bookworm
        if: runner.os == 'Linux'
        env:
          CORVID_BUILD_SHA: ${{ needs.prepare.outputs.short_sha }}
          CORVID_BUILD_DATE: ${{ needs.prepare.outputs.commit_date }}
          CORVID_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e CORVID_BUILD_SHA -e CORVID_BUILD_DATE -e CORVID_RELEASE_TAG -e RELEASE_TARGET rust:1.88-bookworm sh -ec '
              apt-get update -qq && apt-get install -y -qq python3-dev
              cargo build --release --locked --target "$RELEASE_TARGET" -p corvid-runtime
              cargo build --release --locked --target "$RELEASE_TARGET" -p corvid-cli -p corvid-lsp
              python3 install/rust_notices.py "$RELEASE_TARGET" target/corvid-rust-notices.txt
            '

      - name: Verify an executable linked to a Rust tool
        if: inputs.verify_performance && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $build = (Resolve-Path 'target/${{ matrix.target }}/release').Path
          $cli = Join-Path $build 'corvid.exe'
          $env:CORVID_RUNTIME_STATICLIB_OVERRIDE = Join-Path $build 'corvid_runtime.lib'
          $project = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'static-tool-check')
          Set-Location $project.FullName
          @'
          #![no_std]
          #[no_mangle]
          pub extern "C" fn __corvid_tool_double(n: i64) -> i64 { n * 2 }
          '@ | Set-Content double.rs
          rustc --edition 2021 --crate-type lib --emit=obj -C panic=abort -O double.rs -o double.obj
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $lib = & $vswhere -latest -products '*' -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/lib.exe' | Select-Object -First 1
          & $lib /nologo /out:double.lib double.obj
          @'
          effect arithmetic:
              cost: $0.0
          tool double(n: Int) -> Int uses arithmetic
          agent main() -> Int:
              return double(21)
          '@ | Set-Content main.cor
          & $cli build main.cor --target native --with-tools-lib (Resolve-Path double.lib).Path
          $consumer = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'static-tool-consumer')
          Copy-Item target/bin/main.exe $consumer.FullName
          Set-Location $consumer.FullName
          if ((& ./main.exe) -ne '42') { throw 'Linked tool returned an unexpected value' }

      - name: Measure application release workloads twice
        if: inputs.verify_performance && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $build = (Resolve-Path 'target/${{ matrix.target }}/release').Path
          $env:CORVID_RUNTIME_STATICLIB_OVERRIDE = Join-Path $build 'corvid_runtime.lib'
          $cli = Join-Path $build 'corvid.exe'
          python benches/analysis/application.py $cli --output baseline.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python benches/analysis/application.py $cli --output repeat.json

      - name: Retain release workload samples
        if: inputs.verify_performance && matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: application-profile-windows-x64
          path: |
            baseline.json
            repeat.json
          if-no-files-found: error

      - name: Collect Rust dependency notices
        if: runner.os != 'Linux'
        run: python install/rust_notices.py ${{ matrix.target }} target/corvid-rust-notices.txt

      # Bundle the editor grammar with the compiler release rather than
      # requiring a separately published Marketplace version. The
      # installer feeds this VSIX to every supported editor CLI it finds,
      # so highlighting is automatic and version-matched with Corvid.
      - name: Package Corvid editor extension
        shell: bash
        run: |
          mkdir -p dist
          npm ci --prefix extensions/vscode-corvid
          (
            cd extensions/vscode-corvid
            npx --yes @vscode/vsce@3.6.2 package \
              --out "$GITHUB_WORKSPACE/dist/corvid.vsix"
          )

      - name: Stage artifact
        shell: bash
        run: |
          name="corvid-${{ matrix.target }}"
          stage="dist/$name"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/extensions"
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/corvid.exe" "$stage/bin/"
              cp "target/${{ matrix.target }}/release/corvid-lsp.exe" "$stage/bin/"
              ;;
            *)
              cp "target/${{ matrix.target }}/release/corvid" "$stage/bin/"
              cp "target/${{ matrix.target }}/release/corvid-lsp" "$stage/bin/"
              ;;
          esac
          cp target/corvid-rust-notices.txt "$stage/lib/"
          cp LICENSE "$stage/"
          cp "dist/corvid.vsix" "$stage/extensions/"
          # Stage the runtime staticlib alongside the bin under
          # `$stage/lib/` so post-install discovery via
          # `staticlib_discovery::SiblingLibDir` (which checks
          # `exe_parent.parent()/lib/<name>` = `$CORVID_HOME/lib/<name>`
          # when the bin lives at `$CORVID_HOME/bin/corvid`) finds
          # it without env-var setup. Slice
          # `35V2-P33-release-archive-staticlib`. Without this the
          # `cargo install`-shape friction the first 33M trial
          # reviewer hit ships in every release.
          case "${{ matrix.target }}" in
            *windows-msvc*) cp "target/${{ matrix.target }}/release/corvid_runtime.lib" "$stage/lib/" ;;
            *)              cp "target/${{ matrix.target }}/release/libcorvid_runtime.a" "$stage/lib/" ;;
          esac
          cp -R std "$stage/std"
          # Slice 33Q6 (maintainer-as-reviewer-2026-06-05 P1.1): ship the
          # `corvid_runtime` Python package alongside the binary so the
          # `corvid serve` tools.py autoloader (33Q1b) finds it without
          # the reviewer needing to set PYTHONPATH or `pip install`. The
          # autoloader's `find_bundled_corvid_runtime` resolves this at
          # `<binary_parent>/../runtime-py/` — for a binary installed at
          # `$CORVID_HOME/bin/corvid`, that's `$CORVID_HOME/runtime-py/`.
          # Pre-33Q6 the scaffold's "Next steps" output told reviewers to
          # `pip install corvid-runtime`, but the package isn't on PyPI;
          # every release-installed reviewer's first attempt at Surface 3
          # of the trial died with `ModuleNotFoundError`.
          cp -R runtime/python "$stage/runtime-py"
          [ -f LICENSE-MIT ]    && cp    LICENSE-MIT    "$stage/LICENSE-MIT"    || true
          [ -f LICENSE-APACHE ] && cp    LICENSE-APACHE "$stage/LICENSE-APACHE" || true
          [ -f README.md ]      && cp    README.md      "$stage/README.md"      || true

      - name: Verify the packaged macOS Python dependency
        if: runner.os == 'macOS'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          for cli in corvid corvid-lsp; do
            otool -L "dist/corvid-$RELEASE_TARGET/bin/$cli" | awk '{print $1}' | grep -Fx "$CORVID_PYTHON_FRAMEWORK"
          done

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist && tar -czf "corvid-${{ matrix.target }}.tar.gz" "corvid-${{ matrix.target }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "corvid-${{ matrix.target }}"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force

      - name: Build and serve an app from the candidate archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.archive }}
        run: |
          set -eu
          id="$(cargo pkgid --locked -p corvid-cli)"
          version="${id##*#}"
          version="${version##*@}"
          archive="dist/corvid-$TARGET.$EXTENSION"
          if [ "$RUNNER_OS" = Linux ]; then
            docker run --rm -v "$PWD:/checkout:ro" -w /tmp debian:bookworm-slim \
              sh -ec 'apt-get update -qq && apt-get install -y -qq python3 libpython3.11 &&
                python3 /checkout/install/test_release_archive.py "$1" "$2"' sh "/checkout/$archive" "$version"
          else
            python install/test_release_archive.py "$archive" "$version"
          fi

      - name: Check native macOS installer upgrade, rollback and uninstall
        if: runner.os == 'macOS'
        run: python3 install/test_upgrade.py

      - name: Retain candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: corvid-package-${{ matrix.target }}
          path: dist/corvid-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: corvid-package-*
          path: dist
          merge-multiple: true
      - name: Hash the Linux, macOS and Windows archives
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          archives=()
          for target in {aarch64,x86_64}-{apple-darwin,unknown-linux-gnu}; do
            archives+=("corvid-$target.tar.gz")
          done
          for target in {aarch64,x86_64}-pc-windows-msvc; do
            archives+=("corvid-$target.zip")
          done
          shopt -s nullglob
          actual=(corvid-*)
          if (( ${#actual[@]} != ${#archives[@]} )); then
            echo "Expected exactly six native archives, found ${#actual[@]}." >&2
            exit 1
          fi
          sha256sum -- "${archives[@]}" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corvid-archive-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: [prepare, checksums]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: corvid-package-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: corvid-archive-checksums
          path: dist
      - name: Verify downloaded archives against the candidate checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Upload candidate archives to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          name: ${{ needs.prepare.outputs.release_tag }}
          fail_on_unmatched_files: true
          files: |
            dist/corvid-*
            dist/SHA256SUMS.txt

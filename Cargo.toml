[workspace]
resolver = "2"
members = [
    "crates/corvid-syntax",
    "crates/corvid-ast",
    "crates/corvid-resolve",
    "crates/corvid-types",
    "crates/corvid-trace-schema",
    "crates/corvid-tour-catalog",
    "crates/corvid-c-header",
    "crates/corvid-guarantees",
    "crates/corvid-abi",
    "crates/corvid-abi-verify",
    "crates/corvid-ir",
    "crates/corvid-prompt-format",
    "crates/corvid-vm",
    "crates/corvid-repl",
    "crates/corvid-codegen-py",
    "crates/corvid-codegen-cl",
    "crates/corvid-codegen-wasm",
    "crates/corvid-runtime-core",
    "crates/corvid-runtime",
    "crates/corvid-connector-runtime",
    "crates/corvid-macros",
    "crates/corvid-test-tools",
    "crates/corvid-driver",
    "crates/corvid-differential-verify",
    "crates/corvid-cli",
    "crates/corvid-browser",
    "crates/corvid-bind",
    "crates/corvid-host-compliance-tests",
    "crates/corvid-shadow-daemon",
    "crates/corvid-lsp",
    "examples/refund_bot_demo",
    "examples/openai_hello",
    "examples/anthropic_hello",
    "benches/moat/time_to_audit/corpus_gen",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Corvid Authors"]
license = "MIT"
repository = "https://github.com/Micrurus-Ai/Corvid-lang"
rust-version = "1.75"

[workspace.dependencies]
# parsing
chumsky = "0.9"
ariadne = "0.4"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

# async
tokio = { version = "1", features = ["full"] }

# parallelism
rayon = "1"

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# testing
insta = "1"
tempfile = "3"

# Python interop (optional, opt-in per crate)
pyo3 = { version = "0.22", features = ["auto-initialize"] }

# internal crates
corvid-ast      = { path = "crates/corvid-ast" }
corvid-syntax   = { path = "crates/corvid-syntax" }
corvid-resolve  = { path = "crates/corvid-resolve" }
corvid-types    = { path = "crates/corvid-types" }
corvid-trace-schema = { path = "crates/corvid-trace-schema" }
corvid-tour-catalog = { path = "crates/corvid-tour-catalog" }
corvid-c-header = { path = "crates/corvid-c-header" }
corvid-guarantees = { path = "crates/corvid-guarantees" }
corvid-abi      = { path = "crates/corvid-abi" }
corvid-abi-verify = { path = "crates/corvid-abi-verify" }

corvid-ir       = { path = "crates/corvid-ir" }
corvid-prompt-format = { path = "crates/corvid-prompt-format" }
corvid-vm       = { path = "crates/corvid-vm" }
corvid-repl     = { path = "crates/corvid-repl" }
corvid-codegen-py = { path = "crates/corvid-codegen-py" }
corvid-codegen-cl = { path = "crates/corvid-codegen-cl" }
corvid-codegen-wasm = { path = "crates/corvid-codegen-wasm" }
corvid-runtime-core = { path = "crates/corvid-runtime-core" }
corvid-runtime  = { path = "crates/corvid-runtime" }
corvid-connector-runtime = { path = "crates/corvid-connector-runtime" }
corvid-macros   = { path = "crates/corvid-macros" }
corvid-test-tools = { path = "crates/corvid-test-tools" }
corvid-driver   = { path = "crates/corvid-driver" }
corvid-differential-verify = { path = "crates/corvid-differential-verify" }
corvid-shadow-daemon = { path = "crates/corvid-shadow-daemon" }
corvid-bind = { path = "crates/corvid-bind" }

# Proc-macro deps used by corvid-macros.
proc-macro2 = "1"
quote       = "1"
syn         = { version = "2", features = ["full", "extra-traits"] }

# Compile-time tool registration used by corvid-runtime + tool crates.
inventory   = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
# Thin debug info to line tables only. Preserves panic backtrace
# symbolication (file:line in stack frames) while dropping the
# DWARF DIE tree that explodes object-file size — `cargo test
# --workspace` links ~250 rlibs into ~80 test binaries, and full
# debuginfo + the staticlib was repeatedly exhausting the ~14 GB
# GitHub-hosted runner disk during link, surfacing as `rust-lld`
# SIGBUS during write. Local debugger users who need richer
# variable info can override per-shell with
# `RUSTFLAGS='-C debuginfo=2'`.
debug = "line-tables-only"

[package]
name = "corvid-decimal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Exact decimal arithmetic for Corvid's Decimal type: parsing, checked arithmetic, declared rounding and division. The checker, the interpreter and the native runtime all call this one implementation."

[dependencies]
# Division and rounding need intermediates wider than the 128-bit
# coefficient, so they compute exactly in arbitrary precision and
# check the result back into range.
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde = { workspace = true }

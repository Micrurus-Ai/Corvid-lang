[package]
name = "corvid-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cryptography rules for Corvid: the Bytes and Secret types with constant-time equality, the hex and base64 forms of bytes, SHA-2 hashing, HMAC, Ed25519 signature verification, random tokens, Argon2id password hashing and XChaCha20-Poly1305 encryption for values kept at rest. The checker, the interpreter and the native runtime all call this one implementation."

[dependencies]
# Wipes a secret's bytes when its last reference drops.
zeroize = "1"
corvid-hex = { workspace = true }
# The byte codecs are corvid-text's, so text and bytes share one
# alphabet, one strictness rule and one set of error messages.
corvid-text = { workspace = true }
# The same SHA-2, HMAC and constant-time comparison crates the runtime
# already uses for API keys, release signatures and connector webhooks.
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
# Argon2id password hashing and operating-system entropy: the versions
# the runtime's API-key store already used, which now hashes through
# this crate.
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
# Ed25519 verification: the version the runtime, the ABI tooling and
# the CLI already use to sign and verify releases and attestations.
ed25519-dalek = "2"
# Authenticated encryption for values kept at rest (encryption at rest,
# K1): XChaCha20-Poly1305, whose 24-byte random nonce lets one key take any
# number of writes.
chacha20poly1305 = "0.10"

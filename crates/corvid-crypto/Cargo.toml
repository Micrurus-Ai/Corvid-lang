[package]
name = "corvid-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cryptography rules for Corvid: the Bytes and Secret types with constant-time equality, the hex and base64 forms of bytes, SHA-2 hashing, HMAC, random tokens and Argon2id password hashing. The checker, the interpreter and the native runtime all call this one implementation."

[dependencies]
# The byte codecs are corvid-text's, so text and bytes share one
# alphabet, one strictness rule and one set of error messages.
corvid-text = { workspace = true }
# The same SHA-2, HMAC and constant-time comparison crates the runtime
# already uses for API keys, release signatures and connector webhooks.
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
# Argon2id password hashing and operating-system entropy: the versions
# the runtime's API-key store already used, which now hashes through
# this crate.
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[package]
name = "corvid-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `corvid` command-line compiler."

[[bin]]
name = "corvid"
path = "src/main.rs"

[dependencies]
corvid-text = { workspace = true }
corvid-hex = { workspace = true }
# Ed25519 verification goes through corvid-crypto's strict check.
corvid-crypto = { workspace = true }
corvid-abi = { workspace = true }
corvid-abi-verify = { workspace = true }
corvid-ast = { workspace = true }
corvid-bind = { workspace = true }
corvid-connector-runtime = { workspace = true }
corvid-driver = { workspace = true, features = ["python"] }
corvid-guarantees = { workspace = true }
corvid-ir = { workspace = true }
corvid-resolve = { workspace = true }
corvid-syntax = { workspace = true }
corvid-differential-verify = { workspace = true }
corvid-types = { workspace = true }
corvid-vm = { workspace = true }
corvid-repl = { workspace = true }
corvid-runtime = { workspace = true, features = ["python"] }
corvid-trace-schema = { workspace = true }
corvid-tour-catalog = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
toml = { workspace = true }
async-stream = "0.3"
tokio-stream = "0.1"
tempfile = { workspace = true }
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "signal", "net"] }
axum = { version = "0.7", features = ["ws"] }
matchit = "0.7"
percent-encoding = "2"
multer = "3"
futures = "0.3"
rayon = { workspace = true }
libloading = "0.8"
sha2 = "0.10"
semver = "1"
hmac = "0.12"
tar = "0.4"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
base64 = "0.22"
wasmparser = "0.244.0"
dirs = "5"
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
# B09 P4b: `corvid migrate` applies and plans migrations on Postgres.
postgres = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
corvid-test-paths = { workspace = true }
cc = "1"
tempfile = { workspace = true }
target-lexicon = "0.13"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
hex = "0.4"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

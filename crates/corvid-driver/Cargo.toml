[package]
name = "corvid-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pipeline orchestrator for the Corvid compiler."

[features]
python = ["corvid-runtime/python"]

[dependencies]
# Ed25519 verification goes through corvid-crypto's strict check.
corvid-crypto = { workspace = true }
fd-lock = "4.0.4"
corvid-ast = { workspace = true }
corvid-syntax = { workspace = true }
corvid-resolve = { workspace = true }
corvid-types = { workspace = true }
corvid-ir = { workspace = true }
corvid-codegen-py = { workspace = true }
corvid-codegen-cl = { workspace = true }
corvid-codegen-wasm = { workspace = true }
corvid-c-header = { workspace = true }
corvid-abi = { workspace = true }
corvid-guarantees = { workspace = true }
corvid-runtime = { workspace = true }
corvid-trace-schema = { workspace = true }
corvid-vm = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
ariadne = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
time = { workspace = true }
sha2 = "0.10"
hex = "0.4"
tempfile = { workspace = true }
ureq = "2"
url = "2"
semver = "1"
ed25519-dalek = { version = "2", features = ["std"] }

[dev-dependencies]
tempfile = "3"
# Native dispatch N1: the native connector tests link against the
# release corvid-test-tools staticlib, as the codegen native tests do.
corvid-test-paths = { workspace = true }
# B06: the zone-rules replay test compares the recorded tz database.
corvid-time = { workspace = true }
# B09 P4: the table tests create tables on SQLite and, when
# CORVID_TEST_POSTGRES_URL is set, on Postgres.
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-postgres = "0.7"
serde_json = { workspace = true }
# Slice 33S2b — `executing_http_through_driver.rs` boots a
# loopback HTTP responder via wiremock and tells reqwest to
# resolve a public-looking hostname to that loopback. This
# keeps the structural SSRF block genuinely unconditional in
# production code (no test-only carve-outs) while still
# exercising the real reqwest send path end-to-end.
wiremock = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

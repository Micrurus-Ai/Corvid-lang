[package]
name = "corvid-connector-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared connector contracts, manifests, mock/replay/runtime support for Corvid."

[dependencies]
corvid-text = { workspace = true }
corvid-hex = { workspace = true }
# The webhook verifier's HMAC, constant-time comparison and wiped key.
corvid-crypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[dev-dependencies]
tempfile = { workspace = true }

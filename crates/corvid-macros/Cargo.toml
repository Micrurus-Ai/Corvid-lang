[package]
name = "corvid-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc-macros for Corvid. Defines `#[tool]` — the attribute users put on Rust functions to make them callable from compiled Corvid code via the typed C-ABI bridge."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote       = { workspace = true }
syn         = { workspace = true }

[dev-dependencies]
# Macro-expansion tests use a tiny companion crate that depends on
# corvid-runtime + corvid-macros. See tests/expand.rs.
corvid-runtime = { workspace = true }
tokio          = { workspace = true }
trybuild       = "1"
# Struct-signature #[tool] macro-expand tests (slice
# `35V2-P42-G0-tools-3b`) declare a test struct with serde derives so
# the JSON wrapper exercises the actual serde round-trip the struct
# tools rely on at dispatch.
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true }

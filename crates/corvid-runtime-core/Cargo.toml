[package]
name = "corvid-runtime-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wasm-clean, IO-free core of the Corvid agent runtime: deterministic state machine, replay engine, suspend/resume host bridge, mock+replay connectors, canonical receipt-bytes derivation. Native capabilities live in corvid-runtime-host."

# Library only. Explicitly NOT a cdylib: this crate is consumed as a Rust
# rlib by both corvid-runtime-host (native) and corvid-browser (wasm).
# JS-callable cdylib glue lives in corvid-browser, never here.
[lib]
crate-type = ["rlib"]

# Allowed dep ceiling per docs/meta/runtime-split-design.md, enforced by
# the wasm32-unknown-unknown build gate: corvid-ast, corvid-ir,
# corvid-resolve, corvid-types, corvid-guarantees, corvid-trace-schema,
# corvid-prompt-format, serde, serde_json. No tokio, postgres, reqwest,
# opentelemetry, libloading, or hyper - if any of those creep in, the
# wasm32 build fails and the slice does not land.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

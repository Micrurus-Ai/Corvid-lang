# Template for the Code Maintenance agent's Kubernetes secret.
#
# DO NOT commit this file with real values. Use this as a starting
# point and either:
# - Apply it after replacing the placeholders with `kubectl create
#   secret generic ... --from-literal=...`
# - Manage the secret with sealed-secrets / external-secrets /
#   vault-csi-driver / your platform's KMS-backed mechanism
#
# Every value below MUST be set in production. The git-host credential
# can merge to mainline and tag releases; a suspected leak is a Sev-1
# that pauses real-mode writes until rotated. Scope it to the minimum
# (a GitHub App with only the needed permissions, not a PAT).

apiVersion: v1
kind: Secret
metadata:
  name: code-secrets
  namespace: code
type: Opaque
stringData:
  # Encrypts every connector token (git host, CI host) in
  # connector_tokens. Rotate via
  # `corvid auth keys rotate --kind connector-token`.
  CORVID_CONNECTOR_TOKEN_KEY: "REPLACE_ME_base64_32_bytes"

  # Argon2id pepper for API-key hashing. Rotation invalidates all
  # existing API keys.
  CORVID_API_KEY_PEPPER: "REPLACE_ME_32_bytes"

  # Session signing key. 30-day rotation with 15-minute grace.
  CORVID_SESSION_SIGNING_KEY: "REPLACE_ME_base64_32_bytes"

  # CSRF double-submit secret. Rotation is immediate; old tokens
  # rejected on the safe side.
  CORVID_CSRF_SECRET: "REPLACE_ME_base64_32_bytes"

  # Database connection (Postgres in production, SQLite in dev/test).
  CORVID_DATABASE_URL: "postgres://code:REPLACE_ME@code-db.code.svc.cluster.local:5432/code"

  # Git-host + CI-host keys for real-mode connectors. Only set when the
  # tenant has opted in via `corvid connectors mode --mode real`.
  # Switching to real mode means the agent can write to repositories —
  # treat as a release-checklist event.
  # GITHUB_APP_PRIVATE_KEY: ""
  # GITHUB_APP_ID: ""
  # CI_API_TOKEN: ""

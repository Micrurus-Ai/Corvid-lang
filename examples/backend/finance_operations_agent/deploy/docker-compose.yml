services:
  finance-operations-agent:
    image: corvid/finance-operations-agent:local
    build:
      context: ../../..
      dockerfile: examples/backend/finance_operations_agent/deploy/Dockerfile
    command:
      - corvid
      - run
      - examples/backend/finance_operations_agent/src/main.cor
    environment:
      CORVID_APP_ENV: local
      CORVID_CONNECTOR_MODE: mock
      CORVID_DATABASE_URL: sqlite:/data/finance_operations_agent.db
      CORVID_TRACE_DIR: /data/traces
      CORVID_REQUIRE_APPROVALS: "true"
    ports:
      - "8087:8080"
    volumes:
      - finance-operations-agent-data:/data

volumes:
  finance-operations-agent-data:

apiVersion: v1
kind: Service
metadata:
  name: finance-api
  namespace: finance
  labels:
    app.kubernetes.io/name: finance-operations-agent
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finance-operations-agent
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: finance-worker-metrics
  namespace: finance
  labels:
    app.kubernetes.io/name: finance-operations-agent
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: finance-operations-agent
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finance-data
  namespace: finance
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi

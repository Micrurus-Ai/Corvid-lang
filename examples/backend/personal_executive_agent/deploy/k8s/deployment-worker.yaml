apiVersion: apps/v1
kind: Deployment
metadata:
  name: pea-worker
  namespace: pea
  labels:
    app.kubernetes.io/name: personal-executive-agent
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-executive-agent
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-executive-agent
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: pea-worker
          image: ghcr.io/your-org/personal-executive-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/corvid
            - jobs
            - run
            - --source
            - src/main.cor
            - --state
            - /data/pea.sqlite
            - --workers
            - "2"
            - --lease-ttl-ms
            - "60000"
            - --max-runtime-ms
            - "0"
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: pea-config
            - secretRef:
                name: pea-secrets
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pea-data

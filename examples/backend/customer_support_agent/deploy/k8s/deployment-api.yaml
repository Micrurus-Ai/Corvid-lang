apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-api
  namespace: support
  labels:
    app.kubernetes.io/name: customer-support-agent
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-support-agent
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-support-agent
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: support-api
          image: ghcr.io/your-org/customer-support-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/corvid
            - run
            - --target=server
            - src/main.cor
            - --listen
            - 0.0.0.0:8080
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: support-config
            - secretRef:
                name: support-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /schema
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /schema
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: support-data

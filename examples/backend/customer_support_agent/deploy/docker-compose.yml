services:
  customer-support-agent:
    image: corvid/customer-support-agent:local
    build:
      context: ../../..
      dockerfile: examples/backend/customer_support_agent/deploy/Dockerfile
    command:
      - corvid
      - run
      - examples/backend/customer_support_agent/src/main.cor
    environment:
      CORVID_APP_ENV: local
      CORVID_CONNECTOR_MODE: mock
      CORVID_DATABASE_URL: sqlite:/data/customer_support_agent.db
      CORVID_TRACE_DIR: /data/traces
      CORVID_REQUIRE_APPROVALS: "true"
    ports:
      - "8088:8080"
    volumes:
      - customer-support-agent-data:/data

volumes:
  customer-support-agent-data:
